<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Surcuisine">
    <meta property="og:title" content="Surcuisine">
    <meta property="og:description" content="Surcuisine">
    <meta property="og:url" content="https://www.surcuisine.com/">
    <title>Surcuisine</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body oncontextmenu="return false">

    <div id="app" class="active-sur">

        <!-- Background Layers -->
        <div class="bg bg--sur">
            <img src="images/sur.jpg" alt="Sur">
        </div>
        <div class="bg bg--minimal">
            <img src="images/minimal.jpg" alt="Minimal">
        </div>
        <div class="bg bg--common">
            <img src="images/common.jpg" alt="Common">
        </div>

        <!-- Top-left Logo -->
        <div class="top-logo">
            <img class="top-logo__item top-logo__item--sur"     src="images/logo-sur.png"     alt="Sur-">
            <img class="top-logo__item top-logo__item--minimal" src="images/logo-minimal.png" alt="MINIMAL">
            <img class="top-logo__item top-logo__item--common"  src="images/logo-common.png"  alt="COMMON">
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="bottom-nav__logos">
                <a class="nav-item nav-item--sur"     href="sur/index.html"    data-site="sur">
                    <img src="images/footer-logo-sur.png" alt="Sur-">
                </a>
                <a class="nav-item nav-item--minimal" href="minimal/index.html" data-site="minimal">
                    <img src="images/footer-logo-minimal.png" alt="MINIMAL">
                </a>
                <a class="nav-item nav-item--common"  href="common/index.html"  data-site="common">
                    <img src="images/footer-logo-common.png" alt="COMMON">
                </a>
            </div>
            <div class="bottom-nav__dots">
                <span class="dot dot--sur"></span>
                <span class="dot dot--minimal"></span>
                <span class="dot dot--common"></span>
            </div>
        </nav>

        <!-- Page-transition cover -->
        <div class="cover"></div>

    </div>

    <script>
        const app      = document.getElementById('app');
        const cover    = document.querySelector('.cover');
        const navItems = document.querySelectorAll('.nav-item');
        const sites    = ['sur', 'minimal', 'common'];
        let currentIndex = 0;
        let carouselTimer = null;
        let isMobile = window.matchMedia('(max-width: 768px)').matches;

        // Fade in on load
        window.addEventListener('load', () => {
            app.classList.add('show');
            startCarousel();
        });

        function activate(site) {
            app.className = 'show active-' + site;
            currentIndex = sites.indexOf(site);
        }

        // Desktop hover: pause carousel, resume on leave
        navItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                stopCarousel();
                activate(item.dataset.site);
            });
            item.addEventListener('mouseleave', () => {
                startCarousel();
            });
        });

        // Click: fade out then navigate
        navItems.forEach(item => {
            item.addEventListener('click', e => {
                e.preventDefault();
                stopCarousel();
                const href = item.getAttribute('href');
                cover.style.display = 'block';
                cover.style.opacity = '0';
                cover.style.transition = 'opacity 0.6s';
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        cover.style.opacity = '1';
                    });
                });
                setTimeout(() => { window.location.href = href; }, 650);
            });
        });

        // ── Carousel ──────────────────────────────────────────
        function startCarousel() {
            stopCarousel();
            carouselTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % sites.length;
                activate(sites[currentIndex]);
            }, 3000);
        }

        function stopCarousel() {
            if (carouselTimer) {
                clearInterval(carouselTimer);
                carouselTimer = null;
            }
        }

        // Touch swipe
        let touchStartX = 0;
        app.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        app.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) < 40) return;
            stopCarousel();
            if (dx < 0) {
                currentIndex = (currentIndex + 1) % sites.length;
            } else {
                currentIndex = (currentIndex - 1 + sites.length) % sites.length;
            }
            activate(sites[currentIndex]);
            startCarousel();
        }, { passive: true });
    </script>

</body>
</html>
